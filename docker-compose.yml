services:
  twitter-clone:
    init: true
    stop_grace_period: 15s
    depends_on:
      postgres-service:
        condition: service_healthy
    user: node
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        ARG_NODE_ENV: development
    tty: true
    volumes:
      - './:/app'
    ports:
      - '3000:3000'
    stdin_open: true
    command: "sh -c 'npm ci && npm run db:migrate:dev && exec ./node_modules/.bin/nodemon --signal SIGTERM'"
    environment:
      DB_HOST: postgres-service
      DB_PORT: 5432
      APP_PORT: 3000
      APP_HOST: '0.0.0.0'

  postgres-service:
    image: postgres:17.4
    restart: always
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: twitter_clone
    volumes:
      - twitter_clone_db_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

volumes:
  twitter_clone_db_data:
    driver: local
